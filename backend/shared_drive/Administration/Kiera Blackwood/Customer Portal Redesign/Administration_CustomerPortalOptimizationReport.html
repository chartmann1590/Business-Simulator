<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Dashboard</title>
    <style>
        table {
            border-collapse: collapse;
        }
        
        th {
            background: #366092;
            color: white;
            font-weight: bold;
            padding: 8px;
            border: 1px solid #d0d0d0;
        }
        
        td {
            padding: 8px;
            border: 1px solid #d0d0d0;
            background: white;
            text-align: left;
        }
        
        tr:nth-child(even) {
            background: #f2f2f2;
        }
        
        td:first-child {
            text-align: right;
        }
        
        td:last-child {
            text-align: center;
        }
        
        .totals {
            background: #e7f3ff;
            font-weight: bold;
            border-top: 2px solid #d0d0d0;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td colspan="10" style="text-align: center; font-size: 16pt; font-weight: bold; padding: 12px;">Business Dashboard</td>
        </tr>
        <tr>
            <th style="background: #366092; color: white; font-weight: bold; padding: 8px; border: 1px solid #d0d0d0;">Title</th>
            <th style="background: #366092; color: white; font-weight: bold; padding: 8px; border: 1px solid #d0d0d0;">Department</th>
            <th style="background: #366092; color: white; font-weight: bold; padding: 8px; border: 1px solid #d0d0d0;">Project Name</th>
            <th style="background: #366092; color: white; font-weight: bold; padding: 8px; border: 1px solid #d0d0d0;">Budget</th>
            <th style="background: #366092; color: white; font-weight: bold; padding: 8px; border: 1px solid #d0d0d0;">Revenue</th>
            <th style="background: #366092; color: white; font-weight: bold; padding: 8px; border: 1px solid #d0d0d0;">Profit</th>
        </tr>
        <tr class="totals">
            <td colspan="6" class="totals"></td>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;"></td>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;"></td>
        </tr>
        <tr>
            <th>Employee Name</th>
            <th>Department</th>
            <th>Project Name</th>
            <th>Budget</th>
            <th>Revenue</th>
            <th>Profit</th>
        </tr>
        <tr>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;">Kiera Blackwood</td>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;">Administration</td>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;">Customer Portal Redesign</td>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;$75,000.00</td>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;$25,831.02</td>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;$361,970.04</td>
        </tr>
        <tr>
            <th>Employee Name</th>
            <th>Department</th>
            <th>Project Name</th>
            <th>Budget</th>
            <th>Revenue</th>
            <th>Profit</th>
        </tr>
        <!-- Add more data rows here -->
        <tr>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;">Total Revenue</td>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;$848,324.28</td>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;"></td>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;"></td>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;"></td>
        </tr>
        <!-- Add more data rows here -->
        <tr class="totals">
            <td colspan="6" class="totals"></td>
            <td style="padding: 8px; border: 1px solid #d0d0d0; background: white;">$361,970.04</td>
        </tr>
    </table>
</body>
</html>
