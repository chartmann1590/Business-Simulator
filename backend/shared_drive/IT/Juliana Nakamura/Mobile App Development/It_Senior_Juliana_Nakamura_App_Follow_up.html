<!DOCTYPE html>
<html>
<head>
<style>
  /* Styles for the entire document */
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }
  
  /* Grid style for the spreadsheet */
  table {
    border-collapse: collapse;
    width: 100%;
  }
  
  /* Header row style */
  th, td {
    padding: 8px;
    border: 1px solid #d0d0d0;
  }
  
  /* Data rows style */
  tr:nth-child(even) {
    background-color: #f2f2f2;
  }
  
  /* Totals row style */
  tr:last-child td {
    background-color: #e7f3ff;
    font-weight: bold;
    border-top: 2px solid #d0d0d0;
  }
  
  /* Cell styles for financial formatting */
  th, td {
    text-align: left;
  }
  
  /* Number formatting for financial data */
  .currency {
    font-size: 12pt;
    color: green;
  }
  
  /* Percentage formatting for financial data */
  .percentage {
    font-size: 12pt;
    color: #008000;
  }
</style>
</head>
<body>

<table style="width:100%;">
  <tr>
    <td colspan="8" style="text-align: center; font-size: 16pt; font-weight: bold; padding: 12px;">Business Financial Dashboard</td>
  </tr>
  
  <tr>
    <th style="background: #366092; color: white; font-weight: bold; padding: 8px; border: 1px solid #d0d0d0;">Employee Information</th>
    <th style="padding: 8px; border: 1px solid #d0d0d0;">Current Project</th>
    <th style="padding: 8px; border: 1px solid #d0d0d0;">Business Metrics</th>
  </tr>
  
  <tr>
    <td style="border: 1px solid #d0d0d0; padding: 8px;">
      <table style="width:100%;">
        <tr>
          <td style="padding: 8px;">Name:</td>
          <td style="padding: 8px;">Juliana Nakamura</td>
        </tr>
        <tr>
          <td style="padding: 8px;">Title:</td>
          <td style="padding: 8px;">IT Senior</td>
        </tr>
        <tr>
          <td style="padding: 8px;">Department:</td>
          <td style="padding: 8px;">IT</td>
        </tr>
      </table>
    </td>
    
    <td style="border: 1px solid #d0d0d0; padding: 8px;">
      <table style="width:100%;">
        <tr>
          <th style="padding: 8px;">Project Name:</th>
          <th style="padding: 8px;">Budget</th>
          <th style="padding: 8px;">Revenue</th>
        </tr>
        
        <tr>
          <td style="background: #f2f2f2; padding: 8px;">Mobile App Development</td>
          <td style="background: #f2f2f2; padding: 8px;$150,000.00</td>
          <td style="background: #f2f2f2; padding: 8px;">$32,045.32</td>
        </tr>
      </table>
    </td>
    
    <td style="border: 1px solid #d0d0d0; padding: 8px;">
      <table style="width:100%;">
        <tr>
          <th style="padding: 8px;">Total Revenue:</th>
          <th style="padding: 8px;$848,324.28</th>
        </tr>
        
        <tr>
          <th style="padding: 8px;">Total Profit:</th>
          <th style="padding: 8px;$361,970.04</th>
        </tr>
        
        <tr>
          <th style="padding: 8px;">Total Expenses:</th>
          <th style="padding: 8px;$486,354.24</th>
        </tr>
        
        <tr>
          <th style="padding: 8px;">Profit Margin:</th>
          <td class="percentage" style="padding: 8px; color: #008000;">42.67%</td>
        </tr>
      </table>
    </td>
  </tr>
  
  <!-- Rest of the table... -->
</table>

</body>
</html>
